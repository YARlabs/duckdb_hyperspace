[package]
name = "duckdb-hyperspace"
version = "4.2.0"
edition = "2021"
authors = ["YARlabs <hi@yar.ink>"]
description = "DuckDB & Apache Arrow IPC Zero-Copy Analytics Extension for HyperspaceDB"
homepage = "https://yar.ink"
repository = "https://github.com/YARlabs/duckdb_hyperspace"
documentation = "https://yar.ink/docs"
license = "Apache-2.0"
readme = "README.md"
keywords = ["hyperspacedb", "duckdb", "apache-arrow", "vector-database", "analytics"]
categories = ["database", "science"]

[lib]
name = "duckdb_hyperspace"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "duckdb-hyperspace"
path = "src/bin/duckdb-hyperspace.rs"

[dependencies]
hyperspace-sdk = "4.2.0"
arrow-array = "54.2"
arrow-buffer = "54.2"
arrow-ipc = "54.2"
arrow-schema = "54.2"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
